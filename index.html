    </div>`;
  }

  /* ---------- Trilhas ---------- */
  Views.trilhas = (r) => {
    if (r.a === 'glossario') return glossarioView();
    if (r.a && TRILHA_BY_ID[r.a]) return trilhaDetalhe(TRILHA_BY_ID[r.a], r.b);
    const ordem = Calc.ordem();
    return `
    <div class="page-head"><h1>Trilhas de desenvolvimento</h1><p>A ordem abaixo é a curadoria recomendada para o caminho Analista Comercial → corporativo. Excel vem primeiro porque é a base de quase tudo.</p></div>
    <div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="true">Trilhas</button><button class="tab" role="tab" aria-selected="false" data-go="#/trilhas/glossario">Glossário de conceitos</button></div>
    <div class="grid g-auto">${ordem.map((tid, i) => { const t = TRILHA_BY_ID[tid]; const p = Calc.trilhaPct(tid); return `
      <button class="card trail-card" data-go="#/trilhas/${tid}">
        <div class="head"><span class="tico" style="background:${t.cor}22">${ic(t.icone)}</span><div style="flex:1"><h3>${esc(t.nome)}</h3><div class="meta" style="margin-top:6px">${prioChip(t.prio)}<span class="chip outline">${t.modulos.length} ${t.tipo === 'ferramentas' ? 'ferramentas' : 'módulos'}</span></div></div><span class="order-num" aria-label="Ordem ${i + 1}">${i + 1}</span></div>
        <p>${esc(t.resumo)}</p>
        <div><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px"><span class="muted">${Calc.trilhaModsDone(tid)} de ${t.modulos.length} concluídos</span><span style="color:var(--violet-deep)">${p}%</span></div><div class="bar thin"><i style="width:${p}%;background:${t.cor}"></i></div></div>
      </button>`; }).join('')}</div>
    <div class="card" style="margin-top:18px"><h3 style="font-size:15px;font-weight:800;margin-bottom:8px">Como a priorização funciona</h3><p class="muted" style="margin:0"><svg class="ic dot e" aria-hidden="true"><use href="#i-dot"/></svg> <b>Essencial</b>: aparece em quase toda vaga de escritório (Excel, dados/Power BI, ferramentas, ERP, CRM). <svg class="ic dot i" aria-hidden="true"><use href="#i-dot"/></svg> <b>Importante</b>: diferencial forte (administração, finanças, logística, SQL). <svg class="ic dot c" aria-hidden="true"><use href="#i-dot"/></svg> <b>Complementar</b>: amplia o repertório (marketing, VBA). CRM foi promovido a essencial porque conecta direto com a experiência comercial que você já tem.</p></div>`;
  };
  function glossarioView() {
    return `<div class="page-head"><h1>Glossário de conceitos</h1><p>Os termos que mais aparecem em reuniões e vagas. Todos também aparecem na busca.</p></div>
    <div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="false" data-go="#/trilhas">Trilhas</button><button class="tab" role="tab" aria-selected="true">Glossário de conceitos</button></div>
    <div class="card"><div class="gloss">${D.glossario.map(([k, v]) => `<div id="g-${esc(k).replace(/\W+/g, '-')}"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('')}</div></div>`;
  }
  function trilhaDetalhe(t, abrir) {
    const p = Calc.trilhaPct(t.id);
    let grupoAtual = null;
    const mods = t.modulos.map((m0, i) => {
      const m = MOD_BY_ID[m0.id];
      let grp = '';
      if (m.grupo && m.grupo !== grupoAtual) { grupoAtual = m.grupo; grp = `<div class="group-label">${esc(m.grupo)}</div>`; }
      return grp + moduloHTML(m, i, abrir === m.id);
    }).join('');
    return `
    <button class="back" data-go="#/trilhas">← Todas as trilhas</button>
    <section class="trail-hero" style="background:linear-gradient(135deg, ${t.cor}, #4E3488)">
      <div><div style="font-size:30px" aria-hidden="true">${ic(t.icone)}</div><h1>${esc(t.nome)}</h1><p>${esc(t.resumo)}</p><p style="font-size:14px;margin-top:10px"><b>Por que agora:</b> ${esc(t.porque)}</p><div class="bar"><i style="width:${p}%"></i></div></div>
      <div class="big-pct">${p}%<div style="font-family:var(--sans);font-size:13px;font-weight:700;opacity:.85">${Calc.trilhaModsDone(t.id)} de ${t.modulos.length} concluídos</div></div>
    </section>
    ${mods}`;
  }
  function moduloHTML(m, i, aberto) {
    const done = Calc.modComplete(m); const pct = Calc.modPct(m);
    const allPrev = m.tarefas.filter((t) => t.k !== 'ok').every((t) => Calc.isDone(m.id, t.k));
    const ferramenta = m.trilha.tipo === 'ferramentas';
    const cursos = (m.cursos || []).map((id) => CURSO_BY_ID[id]).filter(Boolean);
    const checks = m.tarefas.map((t) => {
      const on = Calc.isDone(m.id, t.k); const lock = t.k === 'ok' && !allPrev && !on;
      return `<label class="check ${on ? 'is-done' : ''} ${lock ? 'locked' : ''}" ${lock ? 'title="Conclua as outras atividades primeiro"' : ''}><input type="checkbox" data-task="${m.id}:${t.k}" ${on ? 'checked' : ''} ${lock ? 'disabled' : ''}><span class="lbl">${esc(t.label)}</span><span class="xp">+${t.xp} XP</span></label>`;
    }).join('');
    const conteudo = ferramenta ? `
      <div class="tool-grid"><div><b>O que é</b>${esc(m.oq)}</div><div><b>Para que serve</b>${esc(m.pq)}</div><div><b>Onde é utilizada</b>${esc(m.onde)}</div><div><b>Importância</b>${prioChip(m.imp)}</div></div>
      <div class="box"><b>Exercício:</b> ${esc(m.ex)}</div>
      ${m.link ? `<button class="btn sm soft" data-go="#/trilhas/${m.link}">Ir para a trilha completa</button>` : ''}`
      : `
      <h4>Objetivo</h4><p style="margin:0 0 12px">${esc(m.obj)}</p>
      <h4>Conteúdo</h4><ul>${m.cont.map((c) => `<li>${esc(c)}</li>`).join('')}</ul>
      <div class="box"><b>Exercício prático:</b> ${esc(m.ex)}</div>
      <div class="box pink"><b>Desafio:</b> ${esc(m.dz)}</div>`;
    return `
    <details class="card module ${done ? 'done' : ''}" id="mod-${m.id}" ${aberto ? 'open' : ''}>
      <summary>
        <span class="mod-status" aria-hidden="true">${done ? '<svg class="ic" aria-hidden="true"><use href="#i-check"/></svg>' : i + 1}</span>
        <div><div class="mod-title">${esc(m.t)}</div><div class="mod-sub"><span>${esc(m.nivel)}</span><span>⏱ ${fmtHoras(m.min)}</span>${pct > 0 && !done ? `<span style="color:var(--violet)">${pct}% feito</span>` : ''}</div></div>

  /* ---------- Cursos ---------- */
  const filtrosCurso = { trilha: 'todas', tipo: 'todos', q: '' };
  Views.cursos = (r) => {
    const destaque = r.params.get('c');
    const lista = D.cursos.filter((c) => {
      if (filtrosCurso.trilha !== 'todas' && !(CURSO_TRILHAS[c.id] && CURSO_TRILHAS[c.id].has(filtrosCurso.trilha))) return false;
      if (filtrosCurso.tipo === 'gratuito' && c.tipo === 'Pago') return false;
      if (filtrosCurso.tipo === 'pago' && c.tipo === 'Gratuito') return false;
      if (filtrosCurso.q && !(c.nome + c.plat + c.tema).toLowerCase().includes(filtrosCurso.q.toLowerCase())) return false;

    });

    <div class="grid g-auto">${lista.map((c) => { const done = !!Store.s.cursos[c.id]; return `

        <div style="display:flex;gap:6px;flex-wrap:wrap">${tipoChip(c.tipo)}</div>
        <div><h3>${esc(c.nome)}</h3><div class="plat">${esc(c.plat)}</div></div>

        <div class="foot"><a class="btn sm primary" href="${esc(c.url)}" target="_blank" rel="noopener">Abrir curso</a><button class="btn sm ${done ? 'soft' : ''}" data-action="toggle-curso" data-curso="${c.id}">${done ? '<svg class="ic" aria-hidden="true"><use href="#i-check"/></svg> Concluído' : 'Marcar como concluído'}</button></div>
      </article>`; }).join('') || '<div class="card empty"><div class="big"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg></div>Nenhum curso com esses filtros.</div>'}</div>`;

  /* ---------- Desafios ---------- */
  Views.desafios = (r) => {
    const aberto = r.a;

    <div class="page-head"><h1>Desafios práticos</h1><p>Exercícios com cara de trabalho real. Cada passo vale +10 XP e concluir o desafio inteiro vale +30 XP extras.</p></div>

      const st = Store.s.desafios[d.id] || { passos: {} };

  /* ---------- O Caminho (roadmap) ---------- */
  function estadoRoadmap() {
    const media = (ids) => Math.round(ids.reduce((a, id) => a + Calc.trilhaPct(id), 0) / ids.length);
    const st = D.roadmap.map((e) => {
      let prog = 100;
      if (e.trilhas) prog = Math.min(100, Math.round((media(e.trilhas) / e.alvo) * 100));
      if (e.id === 'cons') prog = Math.round(((Math.min(3, Calc.desafiosCompletos()) + Math.min(2, Calc.projetosConcluidos())) / 5) * 100);
      return { ...e, prog };
    });
    let alcancou = true;
    st.forEach((e, i) => {
      if (e.id === 'obj') e.prog = alcancou ? 100 : 0;
      e.reached = alcancou && e.prog >= 100;
      if (!e.reached) alcancou = false;
    });
    const cur = st.findIndex((e) => !e.reached);
    return { st, cur: cur === -1 ? st.length - 1 : cur };
  }

  function processarFoto(file) {
    if (!file || !file.type.startsWith('image/')) { toast('Escolha um arquivo de imagem.'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const S = 400; const c = document.createElement('canvas'); c.width = c.height = S;
        const side = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);
        const data = c.toDataURL('image/jpeg', 0.86);
        Store.update((s) => { s.perfil.foto = data; });
        toast('Foto atualizada <svg class="ic" aria-hidden="true"><use href="#i-heart"/></svg>', true); render();
      };
      img.onerror = () => toast('Não consegui ler essa imagem. Tente outra.');
      img.src = reader.result;
    };
    Mascot('loading');
    reader.onloadend = () => setTimeout(() => Mascot('loading', { on: false }), 350);
    reader.readAsDataURL(file);
  }

  /* =========================================================

  const norm = (s) => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  let INDICE = null;
  function indice() {

      it.push({ g: ferr ? 'Ferramentas' : 'Módulos', i: m.trilha.icone, t: m.t, s: ferr ? m.oq : `${m.trilha.nome} · ${m.obj}`, go: `#/trilhas/${m.trilha.id}/${m.id}`, txt: [m.t, m.obj, m.oq, m.pq, (m.cont || []).join(' '), m.ex].join(' ') });

  }
  function projetosIndice() { return Store.s.portfolio.map((p) => ({ g: 'Projetos', i: 'briefcase', t: p.titulo, s: p.descricao, go: '#/portfolio', n: norm(p.titulo + ' ' + p.descricao + ' ' + p.ferramentas), nt: norm(p.titulo) })); }
  let srAtivo = 0; let srItens = [];
  function buscar(q) {
    const nq = norm(q.trim());

    if (!nq) {
      srItens = Calc.proximasTarefas(4).map(({ m }) => ({ g: 'Sugestões para agora', i: m.trilha.icone, t: m.t, s: m.trilha.nome, go: `#/trilhas/${m.trilha.id}/${m.id}` }))
        .filter((x, i, a) => a.findIndex((y) => y.t === x.t) === i);
    } else {
      const termos = nq.split(/\s+/);
      srItens = indice().concat(projetosIndice())
        .map((x) => ({ x, sc: termos.every((t) => x.n.includes(t)) ? (x.nt.includes(nq) ? 3 : x.nt.includes(termos[0]) ? 2 : 1) : 0 }))
        .filter((r) => r.sc > 0).sort((a, b) => b.sc - a.sc).slice(0, 30).map((r) => r.x);
    }

    const hl = (s) => { let out = esc(s); if (!nq) return out; nq.split(/\s+/).filter((t) => t.length > 1).forEach((t) => { const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'); out = out.replace(re, '<mark>$1</mark>'); }); return out; };

  }
  function abrirBusca() { $('#searchOverlay').classList.add('open'); const i = $('#searchInput'); i.value = ''; buscar(''); setTimeout(() => i.focus(), 20); }

  /* =========================================================

  const Foco = { dur: 25, fim: 0, restante: 25 * 60, rodando: false, timer: null, label: 'Estudo livre', task: null };
  function abrirFoco(modId) {
    const opts = [];

    if (modPref) modPref.tarefas.filter((t) => t.k !== 'ok' && !Calc.isDone(modPref.id, t.k)).forEach((t) => opts.push({ v: modPref.id + ':' + t.k, l: `${t.label}: ${modPref.t}` }));
    Calc.proximasTarefas(10).forEach(({ m, t }) => { const v = m.id + ':' + t.k; if (!opts.find((o) => o.v === v)) opts.push({ v, l: `${t.label}: ${m.t}` }); });
    opts.push({ v: '', l: 'Estudo livre' });
    if (!Foco.rodando) { Foco.task = opts[0].v || null; Foco.label = opts[0].l; Foco.restante = Foco.dur * 60; }
    const C = 2 * Math.PI * 140;
    $('#focus').innerHTML = `
      <button class="close" data-action="close-focus">Sair do foco</button>

      <div class="timer"><svg viewBox="0 0 300 300" aria-hidden="true"><circle cx="150" cy="150" r="140" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="8"/><circle id="focoArc" cx="150" cy="150" r="140" fill="none" stroke="#CDBBEE" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div class="t" id="focoT" role="timer" aria-live="off"></div></div>
      <div class="durs" role="group" aria-label="Duração">${[25, 45, 60].map((d) => `<button data-action="foco-dur" data-d="${d}" aria-pressed="${Foco.dur === d}">${d} min</button>`).join('')}</div>
      <div class="ctrl"><button class="btn primary" data-action="foco-play" id="focoPlay">${Foco.rodando ? 'Pausar' : 'Começar'}</button><button class="btn light" data-action="foco-reset">Recomeçar</button></div>`;

  function pintarFoco() {

    t.textContent = `${String(Math.floor(r / 60)).padStart(2, '0')}:${String(r % 60).padStart(2, '0')}`;
    const C = 2 * Math.PI * 140; $('#focoArc').setAttribute('stroke-dashoffset', C * (1 - r / (Foco.dur * 60)));
    document.title = Foco.rodando ? `${t.textContent} · Foco` : 'Universidade da Lobinha';

  }
  function playFoco() {
    if (Foco.rodando) { Foco.restante = Math.max(0, Math.round((Foco.fim - now()) / 1000)); Foco.rodando = false; clearInterval(Foco.timer); }
    else { Foco.fim = now() + Foco.restante * 1000; Foco.rodando = true; Foco.inicio = Foco.inicio || now(); Foco.timer = setInterval(pintarFoco, 500); }

  }
  function terminarFoco(completo) {
    clearInterval(Foco.timer); Foco.rodando = false;
    const total = Foco.dur * 60; const feito = completo ? total : total - Foco.restante;
    const min = Math.round(feito / 60);
    Foco.restante = total; Foco.inicio = null; document.title = 'Universidade da Lobinha';
    if (min >= 5 || completo) {

      Store.update((s) => s.foco.push({ ts: now(), min, label: Foco.label, xp, completo: !!completo }));

    if (f.dataset.planoAdd) {
      const dia = f.dataset.planoAdd; const txt = (fd.t || '').trim(); if (!txt) return;
      Store.update((s) => { s.plano[dia].push({ id: uid(), t: txt, done: false }); }); render();
      setTimeout(() => { const i = $(`[data-plano-add="${dia}"] input`); if (i) i.focus(); }, 30);
    }
    if (f.id === 'bkForm') {
      Mascot('loading'); setTimeout(() => Mascot('loading', { on: false }), 600);
      try { const data = JSON.parse(decodeURIComponent(escape(atob(fd.code.trim())))); if (!data || !data.v) throw new Error(); StorageAdapter.save(data); Store.init(); closeModal(); toast('Backup restaurado <svg class="ic" aria-hidden="true"><use href="#i-heart"/></svg>', true); render(); }
      catch (er) { toast('Código inválido. Confira se copiou tudo.'); }
    }
  });
  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'k') { e.preventDefault(); abrirBusca(); return; }
    if (k === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); abrirBusca(); return; }
    if (k === 'Escape') {
      if ($('#searchOverlay').classList.contains('open')) return fecharBusca();
      if ($('#modal').classList.contains('open')) return closeModal();
      if ($('#sheet').classList.contains('open')) return fecharSheet();
      if ($('#focus').classList.contains('open')) return fecharFoco();
    }
    if ($('#searchOverlay').classList.contains('open') && srItens.length) {
      if (k === 'ArrowDown' || k === 'ArrowUp') {
        e.preventDefault(); srAtivo = (srAtivo + (k === 'ArrowDown' ? 1 : -1) + srItens.length) % srItens.length;
        $$('.sr-item').forEach((b, i) => b.classList.toggle('active', i === srAtivo)); const a = $('.sr-item.active'); if (a) a.scrollIntoView({ block: 'nearest' });
      }
      if (k === 'Enter') { e.preventDefault(); escolherResultado(srAtivo); }
    }
  });
  window.addEventListener('scroll', () => $('#topbar').classList.toggle('scrolled', window.scrollY > 4), { passive: true });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Foco.rodando) pintarFoco(); });

  /* =========================================================
     RENDER
     ========================================================= */
  let ultimaView = null;
  function render() {
    const r = rota();
    const view = Views[r.view] ? r.view : 'inicio';
    renderChrome(view);
    const main = $('#main');
    main.innerHTML = `<div class="view">${Views[view](r)}</div>`;
    if (view !== ultimaView) {
      window.scrollTo(0, 0); ultimaView = view;
      if (view === 'trilhas' && r.b) { setTimeout(() => { const el = document.getElementById('mod-' + r.b); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 80); }
      if (view === 'cursos' && r.params.get('c')) { setTimeout(() => { const el = document.getElementById('curso-' + r.params.get('c')); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 80); }
    }
    if (view === 'caminho') setTimeout(ajustarRoad, 30);
  }
  let rotaAnterior = rota();
  window.addEventListener('hashchange', () => { const r = rota(); Mascot('page-change', { from: rotaAnterior, to: r }); rotaAnterior = r; ultimaView = null; render(); });
  window.addEventListener('resize', () => { if (rota().view === 'caminho') ajustarRoad(); });

  // Mantém o módulo aberto na mesma posição ao re-renderizar
  const _render = render;
  render = function () {
    const abertos = $$('details.module[open]').map((d) => d.id);
    const y = window.scrollY; const mesmaView = rota().view === ultimaView;
    _render();
    if (mesmaView) { abertos.forEach((id) => { const d = document.getElementById(id); if (d) d.open = true; }); window.scrollTo(0, y); }
  };

  /* ---------------- Boot ---------------- */
  Store.init();
  checarBadges(true);
  const primeiraVez = !Mascot.boasVindasVista();
  if (!Store.s.onboardingVisto) Store.update((s) => { s.onboardingVisto = true; });
  if (primeiraVez && (!location.hash || location.hash === '#/inicio')) history.replaceState(null, '', '#/inicio');
  render();
  if (primeiraVez) {
    Mascot('welcome', { onDone: () => go('#/inicio') });
  } else {
    setTimeout(() => {
      if (Calc.tasksDone() > 0) toast('Bem-vinda de volta, meu pedacinho <svg class="ic" aria-hidden="true"><use href="#i-heart"/></svg>', true);
      else toast(`Que bom ter você aqui, ${esc(primeiroNome())} <svg class="ic" aria-hidden="true"><use href="#i-heart"/></svg>`, true);
    }, 700);
  }
})();

</script>
</body>
</html>
